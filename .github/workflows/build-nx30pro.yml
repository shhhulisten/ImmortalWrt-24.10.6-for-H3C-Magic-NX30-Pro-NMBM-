name: Build ImmortalWrt 24.10.6 for H3C NX30 Pro (NMBM)

on:
  workflow_dispatch:
  push:
    paths:
      - 'nx30pro-nmbm.config'
      - '.github/workflows/build-nx30pro.yml'

permissions:
  contents: write

env:
  SRC_TAG: v24.10.6
  UPSTREAM_VERMAGIC: 6.6.133-1-a8b93917f464536104594f27d870028d

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 格式自动对齐与前置检查编码
      # ---------------------------------------------------------------
      - name: Format alignment and config validation
        run: |
          echo "=== 正在执行工作区配置编码清洗与格式标准化 ==="
          find . -type f \( -name "*.yml" -o -name "*.yaml" -o -name "*.config" -o -name "*.sh" \) -print0 | while IFS= read -r -d '' f; do
            sed -i 's/\r$//' "$f"
            sed -i 's/\xc2\xa0/ /g' "$f"
            sed -i 's/[[:space:]]*$//' "$f"
          done

          if [ -f nx30pro-nmbm.config ]; then
            if grep -nE '^[A-Za-z0-9_]+[[:space:]]+=' nx30pro-nmbm.config; then
              echo "::error::nx30pro-nmbm.config 中存在非法空格赋值"
              exit 1
            fi
            echo "配置文件语法检查通过。"
          else
            echo "::error::未检测到 nx30pro-nmbm.config"
            exit 1
          fi

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost \
                      /usr/share/swift \
                      /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-pip \
            rsync unzip zip file wget curl ca-certificates ccache \
            device-tree-compiler libelf-dev libtool autoconf automake pkg-config \
            subversion swig texinfo bc cpio squashfs-tools \
            liblzo2-dev libzstd-dev libgmp-dev libmpc-dev libmpfr-dev \
            python3-ply python3-yaml ecj fastjar gcc-multilib g++-multilib \
            nano qemu-utils upx-ucl antlr3 asciidoc intltool help2man jq || true
          ccache --version | head -1

      - name: Clone ImmortalWrt source (${{ env.SRC_TAG }})
        run: |
          git clone --depth=1 -b "${SRC_TAG}" \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          echo "HEAD = $(git rev-parse HEAD)"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/.ccache
            ~/.ccache
          key: ccache-nx30pro-${{ env.SRC_TAG }}-${{ hashFiles('nx30pro-nmbm.config') }}-${{ github.run_number }}
          restore-keys: |
            ccache-nx30pro-${{ env.SRC_TAG }}-${{ hashFiles('nx30pro-nmbm.config') }}-
            ccache-nx30pro-${{ env.SRC_TAG }}-
            ccache-nx30pro-

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 1. 注入官方 PassWall 2 源码 (替换旧版 PassWall 1)
          rm -rf package/feeds/luci/luci-app-passwall package/luci-app-passwall
          rm -rf package/feeds/luci/luci-app-passwall2 package/luci-app-passwall2
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/luci-app-passwall2

          # 2. 注入最新版本 Xray 二进制（彻底绕过 Go 编译器冲突，确保 tunnel 入站支持）
          LATEST_XRAY_TAG=$(curl -sL https://api.github.com/repos/XTLS/Xray-core/releases/latest | jq -r '.tag_name' || echo "v25.10.15")
          XRAY_VER="${LATEST_XRAY_TAG#v}"
          echo "检测到 Xray 官方最新版本: ${XRAY_VER}"

          XRAY_PKG_DIR=package/xray-core
          rm -rf feeds/packages/net/xray-core package/feeds/packages/xray-core "$XRAY_PKG_DIR"
          mkdir -p "$XRAY_PKG_DIR"

          cat << EOF > "$XRAY_PKG_DIR/Makefile"
          include \$(TOPDIR)/rules.mk

          PKG_NAME:=xray-core
          PKG_VERSION:=${XRAY_VER}
          PKG_RELEASE:=1

          PKG_SOURCE:=Xray-linux-arm64-v8a.zip
          PKG_SOURCE_URL:=https://github.com/XTLS/Xray-core/releases/download/v\$(PKG_VERSION)/
          PKG_HASH:=skip

          include \$(INCLUDE_DIR)/package.mk

          define Package/xray-core
            SECTION:=net
            CATEGORY:=Network
            TITLE:=A unified platform for anti-censorship (Official Prebuilt)
            URL:=https://github.com/XTLS/Xray-core
            DEPENDS:=+ca-bundle
          endef

          define Build/Prepare
          	mkdir -p \$(PKG_BUILD_DIR)
          	unzip -q -o \$(DL_DIR)/\$(PKG_SOURCE) -d \$(PKG_BUILD_DIR)/
          endef

          define Build/Compile
          endef

          define Package/xray-core/install
          	\$(INSTALL_DIR) \$(1)/usr/bin
          	\$(INSTALL_BIN) \$(PKG_BUILD_DIR)/xray \$(1)/usr/bin/xray
          endef

          \$(eval \$(call BuildPackage,xray-core))
          EOF
          sed -i 's/^          //' "$XRAY_PKG_DIR/Makefile"

          ./scripts/feeds update -i
          ./scripts/feeds install -f xray-core

      - name: Load config and verify selections
        run: |
          cd openwrt
          cp ../nx30pro-nmbm.config .config
          make defconfig
          grep -q '^CONFIG_HAVE_DOT_CONFIG=y' .config || echo 'CONFIG_HAVE_DOT_CONFIG=y' >> .config

          fail=0
          chk_on() {
            if grep -q "^$1=y" .config; then
              echo "  [OK]      $1"
            else
              echo "  [缺失!!]  $1  ($2)"
              fail=1
            fi
          }
          chk_off() {
            if grep -q "^# $1 is not set" .config; then
              echo "  [已关闭]  $1"
            elif grep -q "^$1=y" .config; then
              echo "  [未关闭!] $1  ($2)"
              fail=1
            else
              echo "  [不适用]  $1"
            fi
          }

          echo "=== 1. 设备与平台 ==="
          chk_on CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_h3c_magic-nx30-pro-nmbm "NX30 Pro NMBM 设备未被选中"
          chk_on CONFIG_TARGET_PER_DEVICE_ROOTFS "未按设备裁剪 rootfs"

          echo "=== 2. 代理组件（PassWall 2 + Xray-Only）==="
          chk_on CONFIG_PACKAGE_luci-app-passwall2 "PassWall 2 界面缺失"
          chk_on CONFIG_PACKAGE_xray-core "Xray 核心缺失"
          chk_on CONFIG_PACKAGE_v2ray-geoip "geoip 缺失"
          chk_on CONFIG_PACKAGE_v2ray-geosite "geosite 缺失"
          chk_on CONFIG_PACKAGE_geoview "geoview 缺失"

          # 确保旧版 PassWall 与 Sing-box 彻底关闭
          chk_off CONFIG_PACKAGE_luci-app-passwall "旧版 PassWall 必须关闭"
          chk_off CONFIG_PACKAGE_sing-box "Sing-Box 必须关闭"
          chk_off CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_SingBox "PassWall 2 的 Sing-box 支持必须关闭"

          echo "=== 3. 透明代理内核模块 ==="
          for k in kmod-nft-socket kmod-nft-tproxy kmod-nft-nat; do
            chk_on "CONFIG_PACKAGE_$k" "TProxy 模块缺失"
          done

          if [ "$fail" != "0" ]; then
            echo "::error::配置自检未通过，已中止。"
            exit 1
          fi
          echo "配置自检全部通过。"

      - name: Download package sources
        run: |
          cd openwrt
          make -j$(nproc) download || make -j1 download V=s

      - name: Build firmware
        id: build
        run: |
          cd openwrt
          mkdir -p "$RUNNER_TEMP/blog"
          LOG="$RUNNER_TEMP/blog/build.log"
          rc=0
          if ! make -j$(nproc) > "$LOG" 2>&1; then
            echo "并行编译失败，改用单线程排查..."
            make -j1 V=s >> "$LOG" 2>&1 || rc=1
          fi
          if [ "$rc" = "0" ]; then exit 0; fi

          echo "::error title=编译失败::"
          grep -nE 'make(\[[0-9]+\])?: \*\*\*|Error [0-9]+$|error:|fatal error:' "$LOG" | tail -n 40 || true
          tail -n 60 "$LOG"
          exit 1

      - name: Verify artifacts and report sizes
        id: verify
        run: |
          cd "$GITHUB_WORKSPACE/openwrt"
          BIN=bin/targets/mediatek/filogic
          ls -lh $BIN/*h3c_magic-nx30-pro-nmbm* || true

          find bin/ -name "xray-core_*.ipk" -print -quit | grep -q . || { echo "::error::xray-core 未编出"; exit 1; }
          find bin/ -name "luci-app-passwall2_*.ipk" -print -quit | grep -q . || { echo "::error::passwall2 未编出"; exit 1; }
          echo "产物核实通过！"

      - name: Upload firmware
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-24.10.6-nx30pro-nmbm-${{ github.run_number }}
          path: |
            openwrt/bin/targets/mediatek/filogic/*h3c_magic-nx30-pro-nmbm*
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/profiles.json
            openwrt/bin/targets/mediatek/filogic/config.custom
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: always() && steps.build.outcome == 'success' && steps.verify.outcome == 'success' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NX30 Pro NMBM build ${{ github.run_number }}
          body: |
            基于 ImmortalWrt ${{ env.SRC_TAG }} 编译的 H3C Magic NX30 Pro（NMBM 布局）固件。

            - **代理插件**：全面升级至 **PassWall 2**，仅包含最新版 **Xray-core**。
            - **内核优化**：彻底剔除 Sing-Box，固化 geoview 与 v2ray-geodata，开箱支持分流与 FakeDNS。
          prerelease: false
          files: |
            openwrt/bin/targets/mediatek/filogic/*h3c_magic-nx30-pro-nmbm*
