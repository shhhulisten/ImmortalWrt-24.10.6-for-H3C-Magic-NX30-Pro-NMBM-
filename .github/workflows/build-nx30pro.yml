name: Build ImmortalWrt 24.10.6 for H3C NX30 Pro (NMBM)

on:
  workflow_dispatch:
  push:
    paths:
      - 'nx30pro-nmbm.config'
      - '.github/workflows/build-nx30pro.yml'

permissions:
  contents: write

env:
  SRC_TAG: v24.10.6
  PASSWALL2_REF: ""
  XRAY_CORE_VERSION: "26.9.9"
  MIN_XRAY_CORE_VERSION: "26.7.11"
  UPSTREAM_VERMAGIC: 6.6.133-1-a8b93917f464536104594f27d870028d

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout build recipe
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "--- before ---"
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost \
                      /usr/share/swift \
                      /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get clean
          echo "--- after ---"
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools python3-pip \
            rsync unzip zip file wget curl ca-certificates ccache \
            device-tree-compiler libelf-dev libtool autoconf automake pkg-config \
            subversion swig texinfo bc cpio squashfs-tools \
            liblzo2-dev libzstd-dev libgmp-dev libmpc-dev libmpfr-dev \
            python3-ply python3-yaml ecj fastjar gcc-multilib g++-multilib \
            nano qemu-utils
          sudo apt-get install -y --no-install-recommends \
            upx-ucl antlr3 asciidoc intltool help2man || true
          ccache --version | head -1

      - name: Clone ImmortalWrt source (${{ env.SRC_TAG }})
        run: |
          git clone --depth=1 -b "${SRC_TAG}" \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          echo "HEAD = $(git rev-parse HEAD)"
          git log -1 --format='%H %ci %s'
          cat feeds.conf.default

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/.ccache
            ~/.ccache
          key: ccache-nx30pro-${{ env.SRC_TAG }}-${{ hashFiles('nx30pro-nmbm.config') }}-${{ github.run_number }}
          restore-keys: |
            ccache-nx30pro-${{ env.SRC_TAG }}-${{ hashFiles('nx30pro-nmbm.config') }}-
            ccache-nx30pro-${{ env.SRC_TAG }}-
            ccache-nx30pro-

      - name: Update and install feeds
        run: |
          cd openwrt
          cp feeds.conf.default feeds.conf
          if [ -n "${PASSWALL2_REF}" ]; then
            echo "src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git^${PASSWALL2_REF}" >> feeds.conf
          else
            echo "src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git" >> feeds.conf
          fi
          cat feeds.conf
          ./scripts/feeds update -a

          # 升级 xray-core 到指定版本
          XRAY_MK=feeds/packages/net/xray-core/Makefile
          if [ ! -f "$XRAY_MK" ]; then
            echo "::error::找不到 $XRAY_MK，feeds 结构可能变了"
            exit 1
          fi

          LOWEST=$(printf '%s\n%s\n' "$MIN_XRAY_CORE_VERSION" "$XRAY_CORE_VERSION" | sort -V | head -1)
          if [ "$LOWEST" != "$MIN_XRAY_CORE_VERSION" ]; then
            echo "::error::XRAY_CORE_VERSION=${XRAY_CORE_VERSION} 低于下限 ${MIN_XRAY_CORE_VERSION}"
            exit 1
          fi

          OLD_XRAY_VER=$(grep -m1 '^PKG_VERSION:=' "$XRAY_MK" | cut -d= -f2)
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${XRAY_CORE_VERSION}/" "$XRAY_MK"
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=skip/" "$XRAY_MK"
          echo "xray-core 版本已更新为 ${XRAY_CORE_VERSION}"

          ./scripts/feeds install -a
          ./scripts/feeds install -f -p passwall2 luci-app-passwall2

      - name: Load config and verify selections
        run: |
          cd openwrt
          cp ../nx30pro-nmbm.config .config
          make defconfig
          grep -q '^CONFIG_HAVE_DOT_CONFIG=y' .config || echo 'CONFIG_HAVE_DOT_CONFIG=y' >> .config

          # 下载并预检 xray-core 依赖
          make package/feeds/packages/xray-core/download V=s 2>&1 | tail -30
          XRAY_TARBALL=$(find dl -maxdepth 1 -name "xray-core-${XRAY_CORE_VERSION}.tar.gz" -print -quit 2>/dev/null || true)
          if [ -z "$XRAY_TARBALL" ]; then
            echo "::error::xray-core ${XRAY_CORE_VERSION} 源码下载失败"
            exit 1
          fi

          fail=0
          chk_on() {
            if grep -q "^$1=y" .config; then
              echo "  [OK]      $1"
            else
              echo "  [缺失!!]  $1  ($2)"
              fail=1
            fi
          }
          chk_off() {
            if grep -q "^# $1 is not set" .config; then
              echo "  [已关闭]  $1"
            elif grep -q "^$1=y" .config; then
              echo "  [未关闭!] $1  ($2)"
              fail=1
            else
              echo "  [不适用]  $1"
            fi
          }

          echo "=== 1. 设备与架构 ==="
          chk_on CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_h3c_magic-nx30-pro-nmbm "NX30 Pro NMBM 未被选中"
          chk_on CONFIG_TARGET_PER_DEVICE_ROOTFS "未按设备裁剪 rootfs"

          echo "=== 2. PassWall 2 与核心断言 ==="
          chk_on CONFIG_PACKAGE_luci-app-passwall2 "passwall2 界面缺失"
          chk_on CONFIG_PACKAGE_xray-core "Xray 核心缺失"
          chk_on CONFIG_PACKAGE_v2ray-geoip "geoip 数据缺失"
          chk_on CONFIG_PACKAGE_v2ray-geosite "geosite 数据缺失"
          chk_on CONFIG_PACKAGE_geoview "geoview 缺失"

          # 确保 Sing-box 核心被彻底剔除
          chk_off CONFIG_PACKAGE_sing-box "Sing-Box 必须关闭"
          chk_off CONFIG_PACKAGE_luci-app-passwall2_INCLUDE_SingBox "PassWall2 中的 SingBox 选项必须关闭"
          chk_off CONFIG_PACKAGE_luci-app-passwall "旧版 PassWall 必须关闭"

          echo "=== 3. 必需内核模块（TProxy 与基础功能）==="
          for k in kmod-nft-socket kmod-nft-tproxy kmod-nft-nat kmod-zram kmod-nft-fullcone kmod-tcp-bbr kmod-tun; do
            chk_on "CONFIG_PACKAGE_$k" "关键内核模块缺失"
          done

          if [ "$fail" != "0" ]; then
            echo "::error::配置校验失败，请检查上述缺失/未关闭项"
            exit 1
          fi
          echo "所有核心配置自检通过！"

      - name: Download package sources
        run: |
          cd openwrt
          make -j$(nproc) download || make -j1 download V=s

      - name: Build firmware
        id: build
        run: |
          cd openwrt
          mkdir -p "$RUNNER_TEMP/blog"
          LOG="$RUNNER_TEMP/blog/build.log"
          rc=0
          if ! make -j$(nproc) > "$LOG" 2>&1; then
            echo "并行编译失败，改用单线程重跑..."
            make -j1 V=s >> "$LOG" 2>&1 || rc=1
          fi
          if [ "$rc" = "0" ]; then exit 0; fi

          echo "::error title=编译失败::编译日志已保存，末尾 60 行："
          tail -n 60 "$LOG"
          exit 1

      - name: Verify artifacts and report sizes
        id: verify
        run: |
          cd "$GITHUB_WORKSPACE/openwrt"
          BIN=bin/targets/mediatek/filogic
          ls -lh $BIN/*h3c_magic-nx30-pro-nmbm* || true

          # 校验 xray-core 是否真的编出
          f=$(find bin/packages -name "xray-core_*.ipk" -print -quit 2>/dev/null || true)
          if [ -n "$f" ]; then
            echo "  [OK] 成功生成 $(basename "$f")"
          else
            echo "::error::未能生成 xray-core 安装包"
            exit 1
          fi

          # 校验 passwall2 是否真的编出
          p=$(find bin/packages -name "luci-app-passwall2_*.ipk" -print -quit 2>/dev/null || true)
          if [ -n "$p" ]; then
            echo "  [OK] 成功生成 $(basename "$p")"
          else
            echo "::error::未能生成 luci-app-passwall2 安装包"
            exit 1
          fi

      - name: Upload firmware
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-24.10.6-nx30pro-xray-only-${{ github.run_number }}
          path: |
            openwrt/bin/targets/mediatek/filogic/*h3c_magic-nx30-pro-nmbm*
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/config.custom
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: always() && steps.build.outcome == 'success' && steps.verify.outcome == 'success' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NX30 Pro NMBM (PassWall2 Xray-Only) build ${{ github.run_number }}
          body: |
            基于 ImmortalWrt ${{ env.SRC_TAG }} 为 H3C Magic NX30 Pro 编译的精简固件。
            
            - **代理方案**：PassWall 2 搭配专属 **Xray-core (${{ env.XRAY_CORE_VERSION }})**。
            - **内核精简**：完全剔除 Sing-Box 及多余客户端，规避缺少 .db 闪退的问题。
            - **固化组件**：内置 geoview 与 v2ray-geodata，开箱即支持 FakeDNS 与分流。
          prerelease: false
          files: |
            openwrt/bin/targets/mediatek/filogic/*h3c_magic-nx30-pro-nmbm*
